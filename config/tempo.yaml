# Tempo 2.10 config for demo tracing + Traces Drilldown
# OTLP: :4318 HTTP / :4317 gRPC | Query: :3200
#
# Drilldown Traces needs TraceQL metrics (| rate()), which require
# metrics_generator + local-blocks. Explore "get by Trace ID" does not.

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

# Required for TraceQL metrics / Drilldown → Traces span rate panels
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: php-observability-demo
  storage:
    path: /tmp/tempo/generator/wal
  traces_storage:
    path: /tmp/tempo/generator/traces
  processor:
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

# Enable local-blocks processor for all tenants (needed for | rate())
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]

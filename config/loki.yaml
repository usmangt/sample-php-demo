auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

limits_config:
  # Required for Grafana Logs Drilldown severity breakdown (detected_level)
  allow_structured_metadata: true
  discover_log_levels: true
  volume_enabled: true
  retention_period: 168h
  max_streams_per_user: 0          # 0 = unlimited (per ingester)
  max_global_streams_per_user: 0   # 0 = unlimited (cluster-wide)

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      # store: boltdb-shipper
      store: tsdb
      object_store: filesystem
      # schema: v11
      schema: v13  
      index:
        prefix: index_
        period: 24h

# Minimal ruler configuration (required even if not used)
ruler:
  storage:
    type: local
    local:
      directory: /tmp/loki/rules

# By default, Loki will send anonymous, but uniquely-identifiable usage and configuration
# analytics to Grafana Labs. These statistics are sent to https://stats.grafana.org/
#
# Statistics help us better understand how Loki is used, and they show us performance
# levels for most users. This helps us prioritize features and documentation.
# For more information on what's sent, look at
# https://github.com/grafana/loki/blob/main/pkg/usagestats/stats.go
# Refer to the buildReport method to see what goes into a report.
#
# If you would like to disable reporting, uncomment the following lines:
#analytics:
#  reporting_enabled: false

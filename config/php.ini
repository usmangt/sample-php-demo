; PHP Configuration for observability demo
; Enable error logging
log_errors = On
error_log = /var/log/app/php_errors.log

; Enable access logging
access.log = /var/log/app/php_access.log

; Development settings
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Memory and time limits
memory_limit = 256M
max_execution_time = 30

; Extensions for JSON logging
extension=json

; Date settings
date.timezone = UTC

// Basic Grafana Alloy configuration for PHP log collection
// Simple setup - just collects application.log and sends to Loki

// Monitor PHP application log file
loki.source.file "php_logs" {
  targets = [
    {
      __path__ = "/var/log/app/application.log",
      job = "php-app",
      service = "php-app",
    },
  ]
  forward_to = [loki.process.php_logs.receiver]
}

// Process PHP application logs - extract JSON fields
loki.process "php_logs" {
  forward_to = [loki.write.default.receiver]

  // Parse JSON log entries
  stage.json {
    expressions = {
      timestamp     = "timestamp",
      level        = "level", 
      message      = "message",
      correlation_id = "correlation_id",
      service      = "service",
    }
  }

  // Create labels for filtering
  stage.labels {
    values = {
      level        = "",
      correlation_id = "",
      service      = "",
    }
  }

  // Parse timestamp from log
  stage.timestamp {
    source = "timestamp"
    format = "RFC3339"
  }
}

// Send logs to Loki
loki.write "default" {
  endpoint {
    url = "http://loki:3100/loki/api/v1/push"
  }
}
